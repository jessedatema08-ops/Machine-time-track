<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b263d">
<title>Machine Track</title>
<style>
:root{--navy:#0b263d;--blue:#146b9d;--bg:#eef3f7;--text:#162632;--muted:#667789;--line:#d4e0e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071c2c,#146b9d);font-family:Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 18px 50px #0004}.brand{font-size:24px;font-weight:900;margin:0 0 6px}.sub{font-size:13px;color:var(--muted);margin:0 0 18px}label{display:block;font-size:12px;font-weight:800;color:#536476;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #c7d3dc;border-radius:10px;font-size:17px;margin-bottom:10px}button{width:100%;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:800;background:var(--blue);color:#fff}.error{min-height:18px;color:#8e1919;font-size:12px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
<div class="brand">MACHINE TRACK</div>
<p class="sub">Sign in to continue.</p>
<form id="loginForm">
<label for="code">Access code</label>
<input id="code" type="password" autocomplete="current-password" autofocus>
<div id="error" class="error"></div>
<button type="submit">Sign In</button>
</form>
</div>
<script>
function go(){location.replace('./app.html')}
async function prepare(){
  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready}catch(e){}
  }
}
if(sessionStorage.getItem('MT_AUTH')==='1'){go()}
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  if(code.value==='tc'){
    sessionStorage.setItem('MT_AUTH','1');
    error.textContent='';
    await prepare();
    go();
  }else{
    error.textContent='Incorrect access code.';
    code.value='';
    code.focus();
  }
});
prepare();
</script>
</body>
</html>
