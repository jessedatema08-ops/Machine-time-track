<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b263d"><meta name="mobile-web-app-capable" content="yes">
<title>Machine Track</title><link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<style>
:root{--navy:#0b263d;--blue:#146b9d;--cyan:#00a7d8;--bg:#eef3f7;--text:#162632;--muted:#667789;--line:#d4e0e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{background:linear-gradient(135deg,#071c2c,#146b9d);color:#fff;padding:15px 16px;position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;opacity:.9;margin-top:4px}main{max-width:1150px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0b263d12}.grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}@media(max-width:720px){.grid,.kpis{grid-template-columns:repeat(2,1fr)}}button{border:0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e7eef3;color:#183044}.danger{background:#ffe5e5;color:#8f1818}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.machine{text-align:left;background:#fff;border:1px solid var(--line);min-height:104px}.machine.active{border:2px solid var(--cyan);background:#effaff}.machine .num{font-size:22px;font-weight:900;margin-top:8px}.kpi .l{font-size:11px;text-transform:uppercase;color:var(--muted)}.kpi .v{font-size:21px;font-weight:900;margin-top:5px}label{font-size:12px;font-weight:800;color:#536476;display:block;margin:9px 0 5px}input,select{width:100%;padding:11px;border:1px solid #c7d3dc;border-radius:9px;background:#fff;font-size:16px}.notice{padding:10px;border:1px solid #c8dfec;background:#edf8fd;border-radius:10px;font-size:13px}.warn{background:#fff5df;border-color:#efd19a;color:#7b4b00}.good{background:#edf8f2;border-color:#b8dfca;color:#17643e}.bad{background:#ffeded;border-color:#e6b5b5;color:#8e1919}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:850px;margin:auto;border-radius:18px 18px 0 0;padding:14px;max-height:96vh;overflow:auto}video{width:100%;max-height:55vh;background:#111;border-radius:12px;object-fit:cover}.thumb{max-width:100%;border-radius:10px;margin-top:8px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#e8eef3;font-size:11px;font-weight:800}.hidden{display:none!important}@media print{header,.noPrint{display:none!important}body,main{background:#fff;padding:0}.card{box-shadow:none;border:0}}
</style></head><body>
<header><div class="brand">MACHINE TRACK</div><div id="mode" class="sub"></div></header><main id="app"></main>
<div id="scanModal" class="modal"><div class="sheet"><div class="actions"><button class="secondary" onclick="closeScan()">← Back</button></div><h2>Scan <span id="scanName"></span></h2><div class="notice">Point the camera at the time screen. Machine Track reads the labeled value(s), fills them automatically, then closes the camera. You verify before Save.</div><video id="video" autoplay playsinline muted></video><div id="scanMsg" class="notice" style="margin-top:8px">Starting camera…</div><div class="actions"><button class="primary" onclick="capture()">📷 Read Screen</button><button class="secondary" onclick="manual()">Manual fallback</button><button class="secondary" onclick="stopCamera()">Stop Camera</button></div></div></div>
<div id="verifyModal" class="modal"><div class="sheet"><div class="actions"><button class="secondary" onclick="closeVerify()">← Back</button></div><h2>Verify Reading</h2><div id="verifyInfo" class="small"></div><div id="verifyFields"></div><div id="ocrMsg" class="notice" style="margin-top:8px"></div><img id="preview" class="thumb hidden"><div class="actions"><button class="primary" onclick="saveReading()">✓ Save Reading</button><button class="secondary" onclick="retake()">Retake</button><button class="secondary" onclick="closeVerify()">Cancel</button></div></div></div>
<script>
const KEY='MT_DATA_', today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);let S={mode:'test'},stream=null,pending=null,ocrWorker=null;
function fresh(mode='test'){return{mode,machines:Array.from({length:8},(_,i)=>({id:i+1,name:i<2?'Haas '+(i+1):'Hurco '+(i-1),type:i<2?'haas':'hurco'})),baselines:[],readings:[],selected:1,range:'week',cs:'',ce:''}}
function sk(mode=S.mode){return KEY+mode}function save(){localStorage.setItem(sk(),JSON.stringify(S))}function loadMode(mode){let x=localStorage.getItem(sk(mode));S=x?JSON.parse(x):fresh(mode);S.mode=mode;save();render()}function load(){loadMode(localStorage.getItem('MT_MODE')||'test')}
function base(id){return S.baselines.find(x=>x.machineId===id)}function reads(id){return S.readings.filter(x=>x.machineId===id).sort((a,b)=>a.date.localeCompare(b.date))}function val(m,r){return m.type==='haas'?r.daily.cycle:r.daily.machine}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function period(){let n=new Date(),s,e;n.setHours(0,0,0,0);s=new Date(n);e=new Date(n);e.setHours(23,59,59,999);if(S.range==='yesterday'){s.setDate(s.getDate()-1);e=new Date(s);e.setHours(23,59,59,999)}if(S.range==='week'){let d=s.getDay();s.setDate(s.getDate()+(d===0?-6:1-d))}if(S.range==='lastweek'){let d=s.getDay();s.setDate(s.getDate()+(d===0?-6:1-d)-7);e=new Date(s);e.setDate(e.getDate()+6);e.setHours(23,59,59,999)}if(S.range==='month')s=new Date(n.getFullYear(),n.getMonth(),1);if(S.range==='lastmonth'){s=new Date(n.getFullYear(),n.getMonth()-1,1);e=new Date(n.getFullYear(),n.getMonth(),0);e.setHours(23,59,59,999)}if(S.range==='custom'){s=new Date(S.cs+'T00:00:00');e=new Date(S.ce+'T23:59:59')}return{s,e}}function inP(d){let p=period(),x=new Date(d+'T12:00:00');return x>=p.s&&x<=p.e}function rows(){return S.readings.filter(x=>inP(x.date))}
function render(){let r=rows(),days=new Set(r.map(x=>x.date)).size,m=S.machines.find(x=>x.id===S.selected),mr=r.filter(x=>x.machineId===m.id),tr=S.readings.find(x=>x.machineId===m.id&&x.date===today()),total=r.reduce((a,x)=>a+val(S.machines.find(q=>q.id===x.machineId),x),0);mode.textContent=S.mode==='test'?'🧪 TEST MODE • data is isolated':'🟢 PRODUCTION MODE • real shop data';app.innerHTML=`<div class="actions noPrint"><button class="primary" onclick="render()">Dashboard</button><button class="secondary" onclick="graphs()">📈 Graphs</button><button class="secondary" onclick="history()">🕒 Time History</button><button class="secondary" onclick="report()">📄 Generate Report</button><button class="secondary" onclick="settings()">⚙ Settings</button></div><div class="actions noPrint"><button class="primary" onclick="scan()">📷 Scan Machine</button><button class="secondary" onclick="baseline()">Set Baseline</button><button class="secondary" onclick="backup()">Backup</button><button class="secondary" onclick="transferOut()">Coworker Export</button><button class="secondary" onclick="transferIn()">Coworker Import</button></div><div class="card noPrint"><label>Time Frame</label><select id="range" onchange="S.range=this.value;save();render()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This Week</option><option value="lastweek">Last Week</option><option value="month">This Month</option><option value="lastmonth">Last Month</option><option value="custom">Custom</option></select>${S.range==='custom'?`<div class="grid"><div><label>Start</label><input id="cs" type="date" value="${S.cs}"></div><div><label>End</label><input id="ce" type="date" value="${S.ce}"></div></div><button class="primary" onclick="S.cs=cs.value;S.ce=ce.value;save();render()">Apply</button>`:''}</div><div class="kpis"><div class="card kpi"><div class="l">Period Total</div><div class="v">${total.toFixed(2)} h</div></div><div class="card kpi"><div class="l">Daily Average</div><div class="v">${(days?total/days:0).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Readings</div><div class="v">${r.length}</div></div><div class="card kpi"><div class="l">Missing Today</div><div class="v">${S.machines.filter(x=>!S.readings.some(y=>y.machineId===x.id&&y.date===today())).length}</div></div></div><div class="card"><h2 style="margin:0 0 10px">Machines</h2><div class="grid">${S.machines.map(x=>{let q=S.readings.find(y=>y.machineId===x.id&&y.date===today());return`<button class="machine ${x.id===S.selected?'active':''}" onclick="S.selected=${x.id};save();render()"><b>${x.name}</b><div class="num">${q?val(x,q).toFixed(2)+' h':'—'}</div><div class="small">${q?'Recorded today':'⚠ Needs reading'}</div></button>`}).join('')}</div></div><div class="card"><h2 style="margin:0">${m.name}</h2><span class="pill">${m.type==='haas'?'HAAS • CYCLE + FEED':'HURCO • MACHINE TIME'}</span><div class="kpis" style="margin-top:10px"><div class="card kpi"><div class="l">Today</div><div class="v">${tr?val(m,tr).toFixed(2):'0.00'} h</div></div><div class="card kpi"><div class="l">Period Total</div><div class="v">${mr.reduce((a,x)=>a+val(m,x),0).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Daily Average</div><div class="v">${avg(mr.map(x=>val(m,x))).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Baseline</div><div class="v">${base(m.id)?(m.type==='haas'?base(m.id).cycle:base(m.id).machine).toFixed(2):'Not set'}</div></div></div>${m.type==='haas'&&tr?`<div class="notice good"><b>Feed Time today:</b> ${tr.daily.feed.toFixed(2)} h • Daily average ${avg(mr.map(x=>x.daily.feed)).toFixed(2)} h</div>`:''}${warnings(m.id).map(x=>`<div class="notice warn" style="margin-top:7px">⚠️ ${x}</div>`).join('')}<div class="actions noPrint"><button class="primary" onclick="scan()">📷 Scan</button><button class="secondary" onclick="graphs(${m.id})">Graph</button><button class="secondary" onclick="history()">Time History</button></div></div>`;range.value=S.range}
function warnings(id){let m=S.machines.find(x=>x.id===id),r=reads(id),a=[];for(let i=1;i<r.length;i++){let q=r[i];if(val(m,q)>24)a.push('Daily runtime exceeds 24 hours on '+q.date+'. Verify the reading.')}r.forEach(x=>{if(m.type==='haas'&&x.daily.feed>x.daily.cycle+.01)a.push('Feed Time exceeds Cycle Time on '+x.date+'.')});return[...new Set(a)]}
async function scan(){let m=S.machines.find(x=>x.id===S.selected);if(S.readings.some(x=>x.machineId===m.id&&x.date===today())&&!confirm('A reading already exists today. Replace it?'))return;scanName.textContent=m.name;scanModal.style.display='flex';try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;scanMsg.textContent='Camera live. Center the Machine Time / Feed Time labels and tap Read Screen.'}catch(e){scanMsg.textContent='Camera unavailable. Make sure GitHub Pages is HTTPS and Chrome camera permission is allowed.'}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}function closeScan(){stopCamera();scanModal.style.display='none'}function capture(){let c=document.createElement('canvas');c.width=video.videoWidth||1280;c.height=video.videoHeight||720;c.getContext('2d').drawImage(video,0,0,c.width,c.height);let photo=c.toDataURL('image/jpeg',.88);closeScan();openVerify(photo,true)}function manual(){closeScan();openVerify(null,false)}function retake(){closeVerify();scan()}
function openVerify(photo,auto){let m=S.machines.find(x=>x.id===S.selected);verifyInfo.textContent='The fields below are filled by OCR when confidence is high. Compare them with the photo, then Save.';verifyFields.innerHTML=m.type==='haas'?`<label>Machine / Cycle Time — cumulative hours</label><input id="cycle" type="number" step=".0001" inputmode="decimal"><label>Feed Time — cumulative hours</label><input id="feed" type="number" step=".0001" inputmode="decimal">`:`<label>Machine Time — cumulative hours</label><input id="machine" type="number" step=".0001" inputmode="decimal">`;preview.classList.toggle('hidden',!photo);if(photo)preview.src=photo;pending={photo};verifyModal.style.display='flex';ocrMsg.textContent=auto?'Reading screen…':'Manual fallback.';if(auto)runOCR(photo,m)}function closeVerify(){verifyModal.style.display='none';pending=null}
function parseNum(s){if(!s)return null;let x=s.replace(/,/g,'').trim();if(/^\d+[:.]\d{1,2}$/.test(x)&&x.includes(':')){let[a,b]=x.split(':').map(Number);return a+b/60}let n=Number(x);return Number.isFinite(n)?n:null}
function findLabeled(text,labels){let lines=text.toUpperCase().split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),numRe=/(\d[\d,]*\s*[:.]\s*\d{1,4}|\d[\d,]*\.?\d*)/g;for(let line of lines){if(labels.some(l=>line.includes(l))){let nums=[...line.matchAll(numRe)].map(x=>x[1]);if(nums.length){let n=parseNum(nums.at(-1).replace(/\s/g,''));if(n!==null)return n}}}for(let i=0;i<lines.length;i++){if(labels.some(l=>lines[i].includes(l))){for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){let z=lines[j].match(numRe);if(z){let n=parseNum(z[0].replace(/\s/g,''));if(n!==null)return n}}}}return null}
async function getWorker(){if(ocrWorker)return ocrWorker;if(!window.Tesseract)throw Error('OCR library unavailable');ocrWorker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status)ocrMsg.textContent=`OCR: ${m.status}${m.progress?` ${Math.round(m.progress*100)}%`:''}`}});await ocrWorker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:., /-',preserve_interword_spaces:'1'});return ocrWorker}
async function runOCR(photo,m){try{let w=await getWorker(),out=await w.recognize(photo),text=out.data.text||'',conf=(out.data.confidence||0)/100;if(m.type==='haas'){let cycleV=findLabeled(text,['MACHINE TIME','CYCLE TIME','CYCLE TIMER','MACH TIME']),feedV=findLabeled(text,['FEED TIME','FEED TIMER']);if(cycleV!==null)cycle.value=cycleV.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');if(feedV!==null)feed.value=feedV.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');if(cycleV!==null&&feedV!==null){ocrMsg.innerHTML=`<b>✓ Read complete.</b> OCR confidence ${Math.round(conf*100)}%. Verify both fields, then Save.`}else{ocrMsg.innerHTML='<b>⚠ Could not confidently locate both Haas labels.</b> Retake the photo or use the fields to correct it.'}}else{let machineV=findLabeled(text,['MACHINE TIME','MACHINING TIME','RUN TIME','RUNTIME','MACH TIME']);if(machineV!==null){machine.value=machineV.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');ocrMsg.innerHTML=`<b>✓ Read complete.</b> OCR confidence ${Math.round(conf*100)}%. Verify Machine Time, then Save.`}else ocrMsg.innerHTML='<b>⚠ Could not confidently locate Machine Time.</b> Retake the photo or correct the field.'}}catch(e){ocrMsg.innerHTML='<b>OCR could not start/read this image.</b> Check internet for the first OCR load, then retake or use manual fallback.'}}
function saveReading(){let m=S.machines.find(x=>x.id===S.selected),v=m.type==='haas'?{cycle:+cycle.value,feed:+feed.value}:{machine:+machine.value};if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))return alert('Verify all values before saving.');let b=base(m.id);if(!b)return alert('Set the baseline first.');let old=S.readings.find(x=>x.machineId===m.id&&x.date===today());let prior=reads(m.id).filter(x=>!old||x.id!==old.id).at(-1),pc=prior?prior.cumulative:null;let daily=m.type==='haas'?{cycle:v.cycle-(pc?pc.cycle:b.cycle),feed:v.feed-(pc?pc.feed:b.feed)}:{machine:v.machine-(pc?pc.machine:b.machine)};if(Object.values(daily).some(x=>x<0))return alert('New cumulative value is lower than the previous value/baseline.');if(m.type==='haas'&&daily.feed>daily.cycle+.01&&!confirm('Feed Time is greater than Cycle Time. Save anyway?'))return;S.readings=S.readings.filter(x=>!(x.machineId===m.id&&x.date===today()));S.readings.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),machineId:m.id,date:today(),cumulative:v,daily,source:pending?.photo?'OCR camera':'manual',photo:pending?.photo||null,createdAt:new Date().toISOString()});save();closeVerify();render()}
function baseline(){let m=S.machines.find(x=>x.id===S.selected),b=base(m.id);if(b&&prompt('BASELINE RESET WARNING. Type RESET to continue.')!=='RESET')return;app.innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Back</button><h1>Set Baseline — ${m.name}</h1><div class="notice warn">This is the protected starting cumulative value. It is separate from daily readings.</div>${m.type==='haas'?`<label>Machine / Cycle Time baseline</label><input id="bc" type="number" step=".0001"><label>Feed Time baseline</label><input id="bf" type="number" step=".0001">`:`<label>Machine Time baseline</label><input id="bm" type="number" step=".0001">`}<div class="actions"><button class="primary" onclick="saveBase()">Save Baseline</button></div></div>`}function saveBase(){let m=S.machines.find(x=>x.id===S.selected),v=m.type==='haas'?{cycle:+bc.value,feed:+bf.value}:{machine:+bm.value};if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))return alert('Enter valid baseline values.');S.baselines=S.baselines.filter(x=>x.machineId!==m.id);S.baselines.push({machineId:m.id,...v,setAt:new Date().toISOString()});save();render()}
function history(){let m=S.machines.find(x=>x.id===S.selected),r=reads(m.id).reverse();app.innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Dashboard</button><h1>Time History — ${m.name}</h1>${r.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Cumulative</th><th>Daily</th><th>Source</th><th>Photo</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.date}</td><td>${m.type==='haas'?x.cumulative.cycle.toFixed(3)+' / Feed '+x.cumulative.feed.toFixed(3):x.cumulative.machine.toFixed(3)}</td><td>${m.type==='haas'?x.daily.cycle.toFixed(3)+' / '+x.daily.feed.toFixed(3):x.daily.machine.toFixed(3)} h</td><td>${x.source}</td><td>${x.photo?`<button class="secondary" onclick='showPhoto(${JSON.stringify(x.photo)})'>View</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="notice">No readings yet.</div>`}</div>`}function showPhoto(src){let w=open();if(w)w.document.write(`<body style="margin:0;background:#111"><img src="${src}" style="width:100%"></body>`)}
function graphs(id=S.selected){let m=S.machines.find(x=>x.id===id),r=rows().filter(x=>x.machineId===id).sort((a,b)=>a.date.localeCompare(b.date));app.innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Dashboard</button><h1>Graphs</h1><label>Machine</label><select onchange="graphs(+this.value)">${S.machines.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.name}</option>`).join('')}</select><canvas id="chart" width="1100" height="500" style="margin-top:10px"></canvas></div>`;draw(m,r)}function draw(m,r){let c=chart,x=c.getContext('2d'),w=c.width,h=c.height,p=60,v=r.map(q=>val(m,q)),mx=Math.max(1,...v);x.clearRect(0,0,w,h);x.strokeStyle='#bcc8d1';x.beginPath();x.moveTo(p,25);x.lineTo(p,h-p);x.lineTo(w-20,h-p);x.stroke();let series=[{key:'main',vals:v,label:m.type==='haas'?'Cycle Time':'Machine Time'}];if(m.type==='haas')series.push({key:'feed',vals:r.map(q=>q.daily.feed),label:'Feed Time'});series.forEach((s,si)=>{x.strokeStyle=si?'#777':'#146b9d';x.lineWidth=4;x.beginPath();s.vals.forEach((vv,i)=>{let X=p+(i/Math.max(1,r.length-1))*(w-p-30),Y=h-p-vv/mx*(h-p-40);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()});x.fillStyle='#162632';x.font='16px Arial';x.fillText(m.name+' — Daily Runtime',p,20);r.forEach((q,i)=>{let X=p+(i/Math.max(1,r.length-1))*(w-p-30);x.fillText(q.date.slice(5),X-15,h-p+20)})}
function report(){let r=rows(),p=period();app.innerHTML=`<div class="card"><div class="actions noPrint"><button class="secondary" onclick="render()">← Dashboard</button><button class="primary" onclick="csv()">CSV</button><button class="primary" onclick="xls()">Excel</button><button class="secondary" onclick="print()">Print / PDF</button></div><h1>Machine Track Report</h1><p><b>Period:</b> ${p.s.toISOString().slice(0,10)} through ${p.e.toISOString().slice(0,10)}</p><table><thead><tr><th>Machine</th><th>Total</th><th>Daily Average</th><th>Readings</th></tr></thead><tbody>${S.machines.map(m=>{let a=r.filter(x=>x.machineId===m.id),t=a.reduce((z,q)=>z+val(m,q),0);return`<tr><td>${m.name}</td><td>${t.toFixed(2)} h</td><td>${avg(a.map(q=>val(m,q))).toFixed(2)} h</td><td>${a.length}</td></tr>`}).join('')}</tbody></table></div>`}
function dl(n,d,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}function csv(){let s='Date,Machine,Type,Cumulative Machine/Cycle,Cumulative Feed,Daily Machine/Cycle,Daily Feed,Source\n';rows().forEach(x=>{let m=S.machines.find(q=>q.id===x.machineId);s+=`${x.date},"${m.name}",${m.type},${m.type==='haas'?x.cumulative.cycle:x.cumulative.machine},${m.type==='haas'?x.cumulative.feed:''},${m.type==='haas'?x.daily.cycle:x.daily.machine},${m.type==='haas'?x.daily.feed:''},${x.source}\n`});dl('Machine-Track.csv',s,'text/csv')}function xls(){let s='MACHINE TRACK REPORT\n\nDate\tMachine\tType\tCumulative Machine/Cycle\tCumulative Feed\tDaily Machine/Cycle\tDaily Feed\tSource\n';rows().forEach(x=>{let m=S.machines.find(q=>q.id===x.machineId);s+=`${x.date}\t${m.name}\t${m.type}\t${m.type==='haas'?x.cumulative.cycle:x.cumulative.machine}\t${m.type==='haas'?x.cumulative.feed:''}\t${m.type==='haas'?x.daily.cycle:x.daily.machine}\t${m.type==='haas'?x.daily.feed:''}\t${x.source}\n`});dl('Machine-Track.xls',s,'application/vnd.ms-excel')}
function backup(){dl('Machine-Track-'+S.mode+'-backup.json',JSON.stringify(S,null,2),'application/json')}function transferOut(){dl('Machine-Track-coworker-transfer.json',JSON.stringify({machines:S.machines,baselines:S.baselines,readings:S.readings,exportedAt:new Date().toISOString()}),'application/json')}function transferIn(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),ids=new Set(S.readings.map(q=>q.id)),add=(x.readings||[]).filter(q=>!ids.has(q.id));let conflicts=add.filter(q=>S.readings.some(z=>z.machineId===q.machineId&&z.date===q.date));if(conflicts.length&&!confirm(`${conflicts.length} incoming reading(s) conflict with an existing machine/date. Import anyway?`))return;S.readings.push(...add);save();render();alert('Imported '+add.length+' new reading(s).')}catch{alert('Invalid Machine Track transfer file.')}};r.readAsText(i.files[0])};i.click()}
function settings(){app.innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Dashboard</button><h1>Settings</h1><div class="notice ${S.mode==='test'?'warn':'good'}"><b>${S.mode.toUpperCase()} MODE</b><br>Test and Production data are separate.</div><div class="actions"><button class="primary" onclick="switchMode()">${S.mode==='test'?'Switch to Production':'Switch to Test'}</button><button class="danger" onclick="wipe()">Reset Current Mode</button></div><h3>Machine Names</h3>${S.machines.map(m=>`<label>Machine ${m.id}<input id="mn${m.id}" value="${m.name}"></label>`).join('')}<button class="primary" onclick="saveNames()">Save Names</button></div>`}function saveNames(){S.machines.forEach(m=>m.name=document.getElementById('mn'+m.id).value.trim()||m.name);save();render()}function switchMode(){let nm=S.mode==='test'?'production':'test';if(!confirm('Switch to '+nm.toUpperCase()+' MODE? The other mode data remains untouched.'))return;localStorage.setItem('MT_MODE',nm);loadMode(nm)}function wipe(){if(prompt('This deletes every reading and baseline in the current mode. Type DELETE.')!=='DELETE')return;localStorage.removeItem(sk());loadMode(S.mode)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});load();
</script></body></html>
