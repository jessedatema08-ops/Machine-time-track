<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b263d">
<meta name="mobile-web-app-capable" content="yes">
<title>CameraWorks</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--navy:#0b263d;--blue:#146b9d;--cyan:#00a7d8;--bg:#eef3f7;--card:#fff;--text:#162632;--muted:#647688;--line:#d5e0e8;--good:#157347;--warn:#9b5b00;--bad:#a51d1d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,#071c2c,#146b9d);color:#fff;padding:15px 16px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;margin-top:4px;opacity:.9}
main{max-width:1120px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0b263d12}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}@media(max-width:720px){.grid,.kpis{grid-template-columns:repeat(2,1fr)}}
button{border:0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e7eef3;color:#183044}.danger{background:#ffe5e5;color:#8f1818}.good{background:#e3f5ec;color:#176b42}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.machine{text-align:left;background:#fff;border:1px solid var(--line);min-height:104px}.machine.active{border:2px solid var(--cyan);background:#effaff}.machine b{font-size:15px}.machine .num{font-size:22px;font-weight:900;margin-top:8px}
.kpi .l{font-size:11px;text-transform:uppercase;color:var(--muted)}.kpi .v{font-size:21px;font-weight:900;margin-top:5px}
label{font-size:12px;font-weight:800;color:#536476;display:block;margin:9px 0 5px}input,select{width:100%;padding:11px;border:1px solid #c7d3dc;border-radius:9px;background:#fff;font-size:16px}
.notice{padding:10px;border:1px solid #c8dfec;background:#edf8fd;border-radius:10px;font-size:13px}.warn{background:#fff5df;border-color:#efd19a;color:#7b4b00}.bad{background:#ffeded;border-color:#e6b5b5;color:#8e1919}.goodbox{background:#edf8f2;border-color:#b8dfca;color:#17643e}
.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:850px;margin:auto;border-radius:18px 18px 0 0;padding:14px;max-height:96vh;overflow:auto}
video{width:100%;max-height:55vh;background:#111;border-radius:12px;object-fit:cover}.thumb{max-width:100%;border-radius:10px;margin-top:8px}
.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#e8eef3;font-size:11px;font-weight:800}.hidden{display:none!important}
@media print{header,.noPrint,footer{display:none!important}body,main{background:#fff;padding:0}.card{border:0;box-shadow:none}}
</style>
</head>
<body>
<header><div class="brand">CAMERAWORKS</div><div id="mode" class="sub"></div></header>
<main id="app"></main>
<footer style="text-align:center;padding:20px;color:#718192;font-size:11px">Local-first • Machine runtime tracker</footer>

<div id="scanModal" class="modal"><div class="sheet">
<div class="actions"><button class="secondary" onclick="closeScan()">← Back</button></div>
<h2 style="margin:4px 0">Scan <span id="scanName"></span></h2>
<div class="notice">Keep the <b>Machine Time</b> label and number visible. Haas scans also look for <b>Feed Time</b>. The app captures a photo and attempts local numeric recognition; always verify before saving.</div>
<video id="video" autoplay playsinline muted></video>
<div id="scanMsg" class="notice" style="margin-top:8px">Starting camera…</div>
<div class="actions"><button class="primary" onclick="capture()">📷 Capture & Read</button><button class="secondary" onclick="manual()">Manual Entry</button><button class="secondary" onclick="stopCamera()">Stop Camera</button></div>
</div></div>

<div id="verifyModal" class="modal"><div class="sheet">
<div class="actions"><button class="secondary" onclick="closeVerify()">← Back</button></div>
<h2 id="verifyTitle">Verify Reading</h2><div id="verifyInfo" class="small"></div>
<div id="verifyFields"></div><div id="ocrMsg" class="notice" style="margin-top:8px"></div><img id="preview" class="thumb hidden">
<div class="actions"><button class="primary" onclick="saveReading()">✓ Save Reading</button><button class="secondary" onclick="closeVerify()">Cancel</button></div>
</div></div>

<script>
const APP="CW_FULL_V2", today=()=>{let d=new Date();d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)};
let S={mode:"test",machines:[],baselines:[],readings:[],selected:1,range:"week",cs:"",ce:""},stream=null,pic=null,pending=null;
function fresh(){return {mode:"test",machines:Array.from({length:8},(_,i)=>({id:i+1,name:i<2?"Haas "+(i+1):"Hurco "+(i-1),type:i<2?"haas":"hurco"})),baselines:[],readings:[],selected:1,range:"week",cs:"",ce:""}}
function key(){return APP+"_"+S.mode} function save(){localStorage.setItem(key(),JSON.stringify(S))}
function load(){let x=localStorage.getItem(key());S=x?JSON.parse(x):fresh();S.mode=S.mode||"test";render()}
function getBase(id){return S.baselines.find(x=>x.machineId===id)}
function getRead(id){return S.readings.filter(x=>x.machineId===id).sort((a,b)=>a.date.localeCompare(b.date))}
function period(){let n=new Date(),s,e; n.setHours(0,0,0,0); e=new Date(n);e.setHours(23,59,59,999);s=new Date(n);
if(S.range==="yesterday"){s.setDate(s.getDate()-1);e=new Date(s);e.setHours(23,59,59,999)}
if(S.range==="week"){let d=s.getDay();s.setDate(s.getDate()+(d===0?-6:1-d))}
if(S.range==="lastweek"){let d=s.getDay();s.setDate(s.getDate()+(d===0?-6:1-d)-7);e=new Date(s);e.setDate(e.getDate()+6);e.setHours(23,59,59,999)}
if(S.range==="month")s=new Date(n.getFullYear(),n.getMonth(),1);
if(S.range==="lastmonth"){s=new Date(n.getFullYear(),n.getMonth()-1,1);e=new Date(n.getFullYear(),n.getMonth(),0);e.setHours(23,59,59,999)}
if(S.range==="custom"){s=new Date(S.cs+"T00:00:00");e=new Date(S.ce+"T23:59:59")}
return{s,e}}
function inPeriod(d){let p=period(),x=new Date(d+"T12:00:00");return x>=p.s&&x<=p.e}
function rows(){return S.readings.filter(x=>inPeriod(x.date))}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function val(m,r){return m.type==="haas"?r.daily.cycle:r.daily.machine}
function render(){
let r=rows(),days=new Set(r.map(x=>x.date)).size,m=S.machines.find(x=>x.id===S.selected),mr=r.filter(x=>x.machineId===m.id),tr=S.readings.find(x=>x.machineId===m.id&&x.date===today());
let total=r.reduce((a,x)=>a+val(S.machines.find(q=>q.id===x.machineId),x),0);
document.getElementById("mode").textContent=S.mode==="test"?"TEST MODE • isolated data":"PRODUCTION MODE • shop data";
document.getElementById("app").innerHTML=`
<div class="actions noPrint"><button class="primary" onclick="render()">Dashboard</button><button class="secondary" onclick="graphs()">📈 Graphs</button><button class="secondary" onclick="history()">🕒 Time History</button><button class="secondary" onclick="report()">📄 Generate Report</button><button class="secondary" onclick="settings()">⚙ Settings</button></div>
<div class="actions noPrint"><button class="primary" onclick="scan()">📷 Scan Machine</button><button class="secondary" onclick="baseline()">Set Baseline</button><button class="secondary" onclick="backup()">Backup</button><button class="secondary" onclick="transferOut()">Coworker Export</button><button class="secondary" onclick="transferIn()">Coworker Import</button></div>
<div class="card noPrint"><label>Time Frame</label><select onchange="S.range=this.value;save();render()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This Week</option><option value="lastweek">Last Week</option><option value="month">This Month</option><option value="lastmonth">Last Month</option><option value="custom">Custom</option></select>
${S.range==="custom"?`<div class="grid"><div><label>Start</label><input id="cs" type="date" value="${S.cs}"></div><div><label>End</label><input id="ce" type="date" value="${S.ce}"></div></div><button class="primary" onclick="S.cs=cs.value;S.ce=ce.value;save();render()">Apply</button>`:""}</div>
<div class="kpis"><div class="card kpi"><div class="l">Period Total</div><div class="v">${total.toFixed(2)} h</div></div><div class="card kpi"><div class="l">Daily Average</div><div class="v">${(days?total/days:0).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Readings</div><div class="v">${r.length}</div></div><div class="card kpi"><div class="l">Missing Today</div><div class="v">${S.machines.filter(x=>!S.readings.some(y=>y.machineId===x.id&&y.date===today())).length}</div></div></div>
<div class="card"><h2 style="margin:0 0 10px">Machines</h2><div class="grid">${S.machines.map(x=>{let q=S.readings.find(y=>y.machineId===x.id&&y.date===today());return `<button class="machine ${x.id===S.selected?"active":""}" onclick="S.selected=${x.id};save();render()"><b>${x.name}</b><div class="num">${q?val(x,q).toFixed(2)+" h":"—"}</div><div class="small">${q?"Recorded today":"⚠ Needs reading"}</div></button>`}).join("")}</div></div>
<div class="card"><h2 style="margin:0">${m.name}</h2><span class="pill">${m.type==="haas"?"HAAS • CYCLE + FEED":"HURCO • MACHINE TIME"}</span>
<div class="kpis" style="margin-top:10px"><div class="card kpi"><div class="l">Today</div><div class="v">${tr?val(m,tr).toFixed(2):"0.00"} h</div></div><div class="card kpi"><div class="l">Period Total</div><div class="v">${mr.reduce((a,x)=>a+val(m,x),0).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Daily Average</div><div class="v">${avg(mr.map(x=>val(m,x))).toFixed(2)} h</div></div><div class="card kpi"><div class="l">Baseline</div><div class="v">${getBase(m.id)?(m.type==="haas"?getBase(m.id).cycle:getBase(m.id).machine).toFixed(2):"Not set"}</div></div></div>
${m.type==="haas"&&tr?`<div class="notice goodbox"><b>Feed Time today:</b> ${tr.daily.feed.toFixed(2)} h • Daily average ${avg(mr.map(x=>x.daily.feed)).toFixed(2)} h</div>`:""}
${warnings(m.id).map(x=>`<div class="notice warn" style="margin-top:7px">⚠️ ${x}</div>`).join("")}
<div class="actions noPrint"><button class="primary" onclick="scan()">📷 Scan</button><button class="secondary" onclick="graphs(${m.id})">Graph</button><button class="secondary" onclick="history()">Time History</button></div></div>`;
document.querySelector("select").value=S.range}
function warnings(id){let m=S.machines.find(x=>x.id===id),r=getRead(id),a=[];for(let i=1;i<r.length;i++){let p=r[i-1],q=r[i],pv=m.type==="haas"?p.cumulative.cycle:p.cumulative.machine,cv=m.type==="haas"?q.cumulative.cycle:q.cumulative.machine;if(cv<pv)a.push("Cumulative meter decreased on "+q.date+". Verify the reading.");if(val(m,q)>24)a.push("Daily runtime exceeds 24 hours on "+q.date+". Verify the reading.")}r.forEach(x=>{if(m.type==="haas"&&x.daily.feed>x.daily.cycle+.01)a.push("Feed Time exceeds Cycle Time on "+x.date+".")});return [...new Set(a)]}
async function scan(){
let m=S.machines.find(x=>x.id===S.selected);if(S.readings.some(x=>x.machineId===m.id&&x.date===today())&&!confirm("A reading already exists today. Replace it?"))return;
document.getElementById("scanName").textContent=m.name;document.getElementById("scanModal").style.display="flex";
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;scanMsg.textContent="Camera is live. Frame the screen and capture."}
catch(e){scanMsg.textContent="Camera could not start. On Android Chrome, allow Camera permission and use this PWA over HTTPS. Manual Entry is still available."}}
function stopCamera(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}video.srcObject=null}
function closeScan(){stopCamera();scanModal.style.display="none"}
function capture(){let c=document.createElement("canvas"),v=video;c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext("2d").drawImage(v,0,0,c.width,c.height);pic=c.toDataURL("image/jpeg",.78);closeScan();openVerify(pic)}
function manual(){closeScan();openVerify(null)}
function openVerify(photo){
let m=S.machines.find(x=>x.id===S.selected);verifyTitle.textContent="Verify "+m.name+" Reading";verifyInfo.textContent="OCR is intentionally conservative: values must be verified before they enter the permanent data pool.";
verifyFields.innerHTML=m.type==="haas"?`<label>Machine / Cycle Time — cumulative hours</label><input id="cycle" type="number" step=".01" inputmode="decimal"><label>Feed Time — cumulative hours</label><input id="feed" type="number" step=".01" inputmode="decimal">`:`<label>Machine Time — cumulative hours</label><input id="machine" type="number" step=".01" inputmode="decimal">`;
ocrMsg.textContent=photo?"Photo captured. This build stores the photo audit and provides the verification fields.":"Manual entry.";
preview.classList.toggle("hidden",!photo);if(photo)preview.src=photo;pending={photo};verifyModal.style.display="flex"}
function closeVerify(){verifyModal.style.display="none";pending=null}
function saveReading(){
let m=S.machines.find(x=>x.id===S.selected),v=m.type==="haas"?{cycle:+cycle.value,feed:+feed.value}:{machine:+machine.value};if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))return alert("Enter valid cumulative hour values.");
let b=getBase(m.id),r=getRead(m.id),prev=r.at(-1),pc=prev?prev.cumulative:null;
if(!b)return alert("Set the baseline for this machine before saving daily readings.");
let daily=m.type==="haas"?{cycle:v.cycle-(pc?pc.cycle:b.cycle),feed:v.feed-(pc?pc.feed:b.feed)}:{machine:v.machine-(pc?pc.machine:b.machine)};
if(Object.values(daily).some(x=>x<0))return alert("The new cumulative value is lower than the previous value/baseline. Check the screen reading.");
S.readings=S.readings.filter(x=>!(x.machineId===m.id&&x.date===today()));
S.readings.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),machineId:m.id,date:today(),cumulative:v,daily,source:pending.photo?"camera":"manual",photo:pending.photo||null,createdAt:new Date().toISOString()});save();closeVerify();render()}
function baseline(){
let m=S.machines.find(x=>x.id===S.selected),b=getBase(m.id);if(b&&prompt("BASELINE RESET WARNING. This changes every future daily calculation for this machine. Type RESET to continue.")!=="RESET")return;
let fields=m.type==="haas"?`<label>Machine / Cycle Time baseline</label><input id="bc" type="number" step=".01"><label>Feed Time baseline</label><input id="bf" type="number" step=".01">`:`<label>Machine Time baseline</label><input id="bm" type="number" step=".01">`;
document.getElementById("app").innerHTML=`<div class="card"><div class="actions"><button class="secondary" onclick="render()">← Back</button></div><h1>Set Baseline — ${m.name}</h1><div class="notice warn"><b>Important:</b> This is the starting cumulative meter value. It is not a daily reading. Future daily values are calculated by subtracting the previous cumulative reading.</div>${fields}<div class="actions"><button class="primary" onclick="saveBase()">Save Baseline</button></div></div>`}
function saveBase(){let m=S.machines.find(x=>x.id===S.selected),v=m.type==="haas"?{cycle:+bc.value,feed:+bf.value}:{machine:+bm.value};if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))return alert("Enter valid baseline values.");S.baselines=S.baselines.filter(x=>x.machineId!==m.id);S.baselines.push({machineId:m.id,...v,setAt:new Date().toISOString()});save();render()}
function history(){let m=S.machines.find(x=>x.id===S.selected),r=getRead(m.id).reverse();document.getElementById("app").innerHTML=`<div class="card"><div class="actions"><button class="secondary" onclick="render()">← Dashboard</button></div><h1>Time History — ${m.name}</h1>${r.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Cumulative</th><th>Daily</th><th>Source</th><th>Photo</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.date}</td><td>${m.type==="haas"?x.cumulative.cycle.toFixed(2)+" / Feed "+x.cumulative.feed.toFixed(2):x.cumulative.machine.toFixed(2)}</td><td>${m.type==="haas"?x.daily.cycle.toFixed(2)+" / "+x.daily.feed.toFixed(2):x.daily.machine.toFixed(2)} h</td><td>${x.source}</td><td>${x.photo?`<button class="secondary" onclick='showPhoto(${JSON.stringify(x.photo)})'>View</button>`:"—"}</td></tr>`).join("")}</tbody></table></div>`:"<div class='notice'>No readings yet.</div>"}</div>`}
function showPhoto(src){let w=open();if(w)w.document.write(`<body style="margin:0;background:#111"><img src="${src}" style="width:100%"></body>`)}
function graphs(id=S.selected){let m=S.machines.find(x=>x.id===id),r=rows().filter(x=>x.machineId===id).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById("app").innerHTML=`<div class="card"><div class="actions"><button class="secondary" onclick="render()">← Dashboard</button></div><h1>Graphs</h1><label>Machine</label><select onchange="graphs(+this.value)">${S.machines.map(x=>`<option value="${x.id}" ${x.id===id?"selected":""}>${x.name}</option>`).join("")}</select><canvas id="chart" width="1100" height="500" style="margin-top:10px"></canvas><div class="small">Daily runtime • selected time frame</div></div>`;draw(m,r)}
function draw(m,r){let c=chart,x=c.getContext("2d"),w=c.width,h=c.height,p=60,v=r.map(q=>val(m,q)),mx=Math.max(1,...v);x.clearRect(0,0,w,h);x.strokeStyle="#bcc8d1";x.beginPath();x.moveTo(p,25);x.lineTo(p,h-p);x.lineTo(w-20,h-p);x.stroke();x.strokeStyle="#146b9d";x.lineWidth=4;x.beginPath();r.forEach((q,i)=>{let X=p+(i/Math.max(1,r.length-1))*(w-p-30),Y=h-p-v[i]/mx*(h-p-40);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.fillStyle="#162632";x.font="16px Arial";x.fillText(m.name+" — "+(m.type==="haas"?"Daily Cycle Time":"Daily Machine Time"),p,20);x.font="12px Arial";r.forEach((q,i)=>{let X=p+(i/Math.max(1,r.length-1))*(w-p-30),Y=h-p-v[i]/mx*(h-p-40);x.fillText(q.date.slice(5),X-15,h-p+20);x.fillText(v[i].toFixed(1),X-10,Y-8)})}
function report(){let r=rows(),p=period();document.getElementById("app").innerHTML=`<div class="card"><div class="actions"><button class="secondary" onclick="render()">← Dashboard</button><button class="primary" onclick="csv()">CSV</button><button class="primary" onclick="xls()">Excel</button><button class="secondary" onclick="print()">Print / PDF</button></div><h1>Machine Runtime Report</h1><p><b>Period:</b> ${p.s.toISOString().slice(0,10)} through ${p.e.toISOString().slice(0,10)}</p><table><thead><tr><th>Machine</th><th>Total</th><th>Daily Average</th><th>Readings</th></tr></thead><tbody>${S.machines.map(m=>{let a=r.filter(x=>x.machineId===m.id),t=a.reduce((z,q)=>z+val(m,q),0);return `<tr><td>${m.name}</td><td>${t.toFixed(2)} h</td><td>${avg(a.map(q=>val(m,q))).toFixed(2)} h</td><td>${a.length}</td></tr>`}).join("")}</tbody></table><div class="notice" style="margin-top:12px">The spreadsheet export contains raw daily readings plus a summary sheet-style section and graph-ready data.</div></div>`}
function csv(){let s="Date,Machine,Type,Cumulative Machine/Cycle,Cumulative Feed,Daily Machine/Cycle,Daily Feed,Source\\n";S.readings.filter(x=>inPeriod(x.date)).forEach(x=>{let m=S.machines.find(q=>q.id===x.machineId);s+=`${x.date},"${m.name}",${m.type},${m.type==="haas"?x.cumulative.cycle:x.cumulative.machine},${m.type==="haas"?x.cumulative.feed:""},${m.type==="haas"?x.daily.cycle:x.daily.machine},${m.type==="haas"?x.daily.feed:""},${x.source}\\n`});dl("CameraWorks.csv",s,"text/csv")}
function xls(){let s="CAMERAWORKS MACHINE RUNTIME REPORT\\n\\nDate\\tMachine\\tType\\tCumulative Machine/Cycle\\tCumulative Feed\\tDaily Machine/Cycle\\tDaily Feed\\tSource\\n";S.readings.filter(x=>inPeriod(x.date)).forEach(x=>{let m=S.machines.find(q=>q.id===x.machineId);s+=`${x.date}\\t${m.name}\\t${m.type}\\t${m.type==="haas"?x.cumulative.cycle:x.cumulative.machine}\\t${m.type==="haas"?x.cumulative.feed:""}\\t${m.type==="haas"?x.daily.cycle:x.daily.machine}\\t${m.type==="haas"?x.daily.feed:""}\\t${x.source}\\n`});s+="\\nSUMMARY\\nMachine\\tPeriod Total\\tDaily Average\\n";S.machines.forEach(m=>{let a=S.readings.filter(x=>x.machineId===m.id&&inPeriod(x.date)),t=a.reduce((z,q)=>z+val(m,q),0);s+=`${m.name}\\t${t.toFixed(2)}\\t${avg(a.map(q=>val(m,q))).toFixed(2)}\\n`});dl("CameraWorks.xls",s,"application/vnd.ms-excel")}
function dl(n,d,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
function backup(){dl("CameraWorks-"+S.mode+"-backup.json",JSON.stringify(S,null,2),"application/json")}
function transferOut(){dl("CameraWorks-coworker-transfer.json",JSON.stringify({machines:S.machines,baselines:S.baselines,readings:S.readings,exportedAt:new Date().toISOString()}),"application/json")}
function transferIn(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),ids=new Set(S.readings.map(q=>q.id));let add=(x.readings||[]).filter(q=>!ids.has(q.id));S.readings.push(...add);if(x.baselines)S.baselines=x.baselines;save();render();alert("Imported "+add.length+" new reading(s).")}catch{alert("Invalid CameraWorks transfer file.")}};r.readAsText(f)};i.click()}
function settings(){document.getElementById("app").innerHTML=`<div class="card"><div class="actions"><button class="secondary" onclick="render()">← Dashboard</button></div><h1>Settings</h1><div class="notice ${S.mode==="test"?"warn":"goodbox"}"><b>${S.mode.toUpperCase()} MODE</b><br>Data is stored separately in this device's local database.</div><div class="actions"><button class="primary" onclick="switchMode()">${S.mode==="test"?"Switch to Production":"Switch to Test"}</button><button class="danger" onclick="wipe()">Reset Current Mode</button></div><h3>Machine Names</h3>${S.machines.map(m=>`<label>${m.id}<input id="mn${m.id}" value="${m.name}"></label>`).join("")}<button class="primary" onclick="saveNames()">Save Names</button></div>`}
function saveNames(){S.machines.forEach(m=>m.name=document.getElementById("mn"+m.id).value.trim()||m.name);save();render()}
function switchMode(){if(S.mode==="test"){if(!confirm("Switch to PRODUCTION MODE? Test data stays separate."))return;S.mode="production"}else{if(!confirm("Switch to TEST MODE? Production data stays untouched."))return;S.mode="test"}save();load()}
function wipe(){if(prompt("This deletes every reading and baseline in the current mode. Type DELETE.")!=="DELETE")return;localStorage.removeItem(key());load()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body></html>
